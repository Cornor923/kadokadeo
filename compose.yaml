services:
  kadokadeo_app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: kadokadeo_app
    volumes:
      - .:/www
    networks:
      - kadokadeo_network
    links:
      - kadokadeo_database

  kadokadeo_front:
    image: node:22
    container_name: kadokadeo_front
    volumes:
      - .:/www
    working_dir: /www
    command: 'sh -c "yarn && yarn dev"'

  kadokadeo_database:
    image: postgres:15.1
    container_name: kadokadeo_database
    volumes:
      - ./docker/database:/docker-entrypoint-initdb.d
      - ./docker/database-data:/var/lib/postgresql/data
    networks:
      - kadokadeo_network
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_USER: kadokadeo.dev
      POSTGRES_MULTIPLE_DATABASES: kadokadeo,etwin.dev

  kadokadeo_eternaltwin:
    container_name: kadokadeo_eternaltwin
    # Upstream Eternaltwin `main`, pinned by ETERNALTWIN_REF (see docker/eternaltwin/Dockerfile).
    # Rollback to the old npm CLI: dockerfile Dockerfile.legacy + volume ./eternaltwin:/www (etwin.toml).
    build:
      context: ./docker/eternaltwin
      dockerfile: Dockerfile
      args:
        ETERNALTWIN_REF: 63ace6b0fe60b9cb1540781d0e6ece6b57f342d8
    depends_on:
      - kadokadeo_database
    environment:
      ETERNALTWIN_PROFILE: dev
    volumes:
      # The binary reads ./eternaltwin/eternaltwin.toml (searched in its working directory).
      - ./eternaltwin:/etc/eternaltwin:ro
    networks:
      - kadokadeo_network
    stdin_open: true
    tty: true

  kadokadeo_nginx:
    depends_on:
      - kadokadeo_app
    networks:
      - kadokadeo_network
    container_name: kadokadeo_nginx
    image: nginx:1.21
    volumes:
      - ./docker/app/conf/kadokadeo.conf:/etc/nginx/conf.d/kadokadeo.conf:ro
      - ./:/www:rw
    extra_hosts:
      - 'host.docker.internal:host-gateway'

networks:
  kadokadeo_network:
    driver: bridge
