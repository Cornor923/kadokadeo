upstream php-upstream {
    server kadokadeo_app:9000;
}

server {
    listen 80;
    listen [::]:80;
    server_name kadokadeo.localhost kadokadeo.test;

    root /www/public;

    index index.html index.htm index.php;
    charset utf-8;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    error_page 404 /index.php;

    location /vite/ {
        rewrite ^/vite/(.*)$ /$1 break;

        proxy_pass http://host.docker.internal:5173;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # (__vite-plugin-wasm-helper: the loader of the WebAssembly of vite-plugin-wasm, imported without the /vite prefix)
    location ~ ^/((node_modules|resources|@vite|gfx|@id|assets)/|__vite-plugin-wasm-helper$) {
        proxy_pass http://host.docker.internal:5173;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Reverb (realtime): started in kadokadeo_app by kado:worker, listening on 8080
    location ~ ^/(app|apps)/ {
        proxy_pass http://kadokadeo_app:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php-upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 3600;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

}
